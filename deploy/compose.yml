# Bzaro on a single VPS (docs/HOSTINGER.md).
#
# Infrastructure only. The Next.js app and the lead worker run on the host
# under pm2 (deploy/ecosystem.config.cjs) because `next build` prerenders
# marketplace pages from the database and is far simpler outside a container.
#
#   docker compose --env-file deploy/.env -f deploy/compose.yml up -d
#
# Every port is bound to 127.0.0.1 except Caddy, which owns 80/443.

# Pinned project name. Compose otherwise derives it from the directory holding
# this file, and the named volumes below are prefixed with it (deploy_caddy-data,
# deploy_postgres-data…). Since deploys moved to /srv/bzaro/releases/<id>/deploy
# the directory is still "deploy", but pinning it means a rename can never make
# compose start Postgres or Caddy on a fresh, empty volume.
name: deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: bzaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bzaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: bzaro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bzaro -d bzaro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rate limiting. src/lib/ratelimit.ts speaks the Upstash REST protocol, so a
  # plain Redis sits behind serverless-redis-http, which implements that
  # protocol. UPSTASH_REDIS_REST_URL=http://127.0.0.1:8079 in the app's .env.
  redis:
    image: redis:7-alpine
    container_name: bzaro-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: bzaro-redis-http
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?set SRH_TOKEN in deploy/.env}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:8079:80"

  # TLS termination: certificates on demand per hostname (see Caddyfile).
  # Host networking so it can reach the pm2-managed app on localhost:3000.
  caddy:
    image: caddy:2-alpine
    container_name: bzaro-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      # A stable copy, not ./Caddyfile: a bind mount pins the path it was
      # created with, and that path must survive old releases being pruned.
      # deploy.sh rewrites this file in place and runs `caddy reload`.
      - /srv/bzaro/shared/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Seller uploads are written by the app to the host disk; Caddy serves
      # them straight from there (see MEDIA_LOCAL_UPLOADS in src/env.ts).
      # shared/uploads outlives every release; each release's public/uploads
      # is a symlink to it (deploy/deploy.sh).
      - /srv/bzaro/shared/uploads:/srv/uploads:ro

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
