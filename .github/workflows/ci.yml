name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: types, lint and pure unit tests need no database.
  verify:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so types depend on it.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # The tenant-isolation suite is the gate for every later phase. It needs a
  # real database and a running server, so it is a separate job.
  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace
      DIRECT_DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace
      NEXT_PUBLIC_ROOT_DOMAIN: lvh.me:3000
      NEXT_PUBLIC_PROTOCOL: http
      NEXT_PUBLIC_PLATFORM_NAME: Marketplace
      AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
      AUTH_URL: http://lvh.me:3000
      AUTH_TRUST_HOST: "true"
      REVALIDATE_SECRET: ci-revalidate
      IP_HASH_SALT: ci-salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Applies the hand-written migration SQL too — extensions, partitioning,
      # generated columns and CHECK constraints. If any of that is malformed,
      # CI fails here rather than in production.
      - run: npm run db:deploy
      - run: npm run db:seed

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # lvh.me and *.lvh.me resolve to 127.0.0.1 publicly, so tenant hostnames
      # work on a CI runner with no extra DNS setup.
      - run: npm run test:isolation

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
